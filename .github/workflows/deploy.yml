name: Test e deploy (GitHub Pages + Firebase)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Firebase Hosting (https://chridle.web.app): job a parte, se fallisce non blocca GitHub Pages.
  # firebase-tools 14: le versioni nuove chiedono il permesso serviceusage, che l'account adminsdk non ha.
  firebase:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      # chiave dell'account di servizio Firebase (secret del repo): senza, il deploy si salta
      FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        if: env.FIREBASE_KEY != ''
      - uses: actions/setup-node@v4
        if: env.FIREBASE_KEY != ''
        with:
          node-version: 22
          cache: npm
      - if: env.FIREBASE_KEY != ''
        run: npm ci && npm run build
      - if: env.FIREBASE_KEY != ''
        run: |
          printf '%s' "$FIREBASE_KEY" > "$RUNNER_TEMP/firebase-key.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json" \
            npx -y firebase-tools@14 deploy --only hosting --project chridle --non-interactive
